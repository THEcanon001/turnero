# Promtail configuration — ships logs to Loki
# Scrapes Docker container logs and system journals

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs (auto-discover via Docker socket)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      # Parse JSON logs from the Go server
      - match:
          selector: '{container="turnero-server"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  method: method
                  path: path
                  status: status
                  duration_ms: duration_ms
            - labels:
                level:
                method:

  # System logs (if running on bare metal with journald)
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog
