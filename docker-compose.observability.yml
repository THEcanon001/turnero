# =============================================================================
# Observability stack for Turnero
# Run alongside the main docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: turnero-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - observability
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: turnero-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # TODO: Change admin password for production
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=turnero_grafana
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/business-overview.json
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: turnero-loki
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.expand-env=true
    restart: unless-stopped
    networks:
      - observability

  promtail:
    image: grafana/promtail:latest
    container_name: turnero-promtail
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:latest
    container_name: turnero-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
    networks:
      - observability

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  observability:
    driver: bridge
