services:
  postgres:
    image: postgres:16-alpine
    container_name: turnero-postgres
    environment:
      POSTGRES_DB: turnero
      POSTGRES_USER: turnero
      POSTGRES_PASSWORD: turnero_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnero"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
